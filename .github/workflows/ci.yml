name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.26"

jobs:
  build:
    name: build, vet, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify formatting
        run: test -z "$(gofmt -l cmd internal)" || { gofmt -d cmd internal; exit 1; }

      - name: Build
        run: go build -trimpath -ldflags "-s -w -X main.version=$(git describe --tags --always)" ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -covermode=atomic -coverpkg=./internal/... -coverprofile=coverage.out ./...
        env:
          XDG_CONFIG_HOME: ""
          XDG_DATA_HOME: ""

      - name: Coverage floor (>90% on internal/)
        run: |
          pct=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}' | tr -d '%')
          echo "internal/ coverage: ${pct}%"
          awk -v p="$pct" 'BEGIN { exit (p > 90) ? 0 : 1 }' || {
            echo "::error::coverage ${pct}% is below the 90% floor"; exit 1; }

  cross-build:
    name: cross-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # Every release target must compile on every push, not just at tag time.
      - name: Build the release matrix
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%%/*}"; arch="${target##*/}"
            echo "building $os/$arch"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w" -o "/tmp/rv_${os}_${arch}" ./cmd/rv
          done
          ls -l /tmp/rv_*

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
